<ion-content [fullscreen]="false">
  <div class="conversa-container">

    <!-- Cabeçalho -->
    <div class="conversa-header">
      <button class="btn-voltar" (click)="voltar()">←</button>
      <div class="avatar">
        <img *ngIf="fotoOutroUsuario" [src]="fotoOutroUsuario" alt="Foto">
        <ion-icon *ngIf="!fotoOutroUsuario" name="person-circle-outline"></ion-icon>
      </div>
      <p class="nome">{{ nomeOutroUsuario || 'Usuário' }}</p>
    </div>

    <!-- Área de Mensagens -->
    <div class="mensagens-area" #scrollArea>
      <p class="vazio" *ngIf="mensagens.length === 0">
        Nenhuma mensagem ainda. Diga olá!
      </p>

      <ng-container *ngFor="let mensagem of mensagens">

        <!-- Card de Pedido de Aluguel -->
        <div *ngIf="mensagem.tipoMensagem === 'PEDIDO_ALUGUEL'" class="card-pedido"
          [class.card-pedido-proprio]="mensagem.remetenteId === usuarioAtual.idUsuario">

          <div class="card-pedido-topo">
            <ion-icon name="calendar-outline"></ion-icon>
            <span class="card-pedido-titulo">Pedido de Aluguel</span>
            <span class="card-pedido-status" [ngClass]="'status-' + (mensagem.statusSolicitacao || 'PENDENTE').toLowerCase()">
              {{ labelStatus(mensagem.statusSolicitacao) }}
            </span>
          </div>

          <p class="card-pedido-texto">{{ mensagem.texto }}</p>

          <!-- Botões de Ação quando Pendente -->
          <div class="card-pedido-botoes" *ngIf="mensagem.statusSolicitacao === 'PENDENTE'">
            <!-- Dono: aceitar / recusar -->
            <ng-container *ngIf="souDono(mensagem)">
              <button class="btn-pedido btn-aceitar" (click)="aceitarPedido(mensagem)">Aceitar</button>
              <button class="btn-pedido btn-recusar" (click)="recusarPedido(mensagem)">Recusar</button>
            </ng-container>

            <!-- Solicitante: cancelar -->
            <ng-container *ngIf="souSolicitante(mensagem)">
              <button class="btn-pedido btn-cancelar" (click)="cancelarPedido(mensagem)">Cancelar Pedido</button>
            </ng-container>
          </div>

        </div>

        <!-- Balão Comum -->
        <div *ngIf="mensagem.tipoMensagem !== 'PEDIDO_ALUGUEL'"
          class="balao"
          [class.balao-proprio]="mensagem.remetenteId === usuarioAtual.idUsuario">
          <p class="balao-texto">{{ mensagem.texto }}</p>
        </div>

      </ng-container>
    </div>

    <!-- Barra Inferior de Envio -->
    <div class="input-area">
      <div class="chat-input-wrapper">
        <input type="text" placeholder="Digite uma mensagem..."
          [(ngModel)]="textoNovaMensagem" (keyup.enter)="enviar()">
      </div>
      <button class="btn-enviar" (click)="enviar()">
        <ion-icon name="send-outline"></ion-icon>
      </button>
    </div>

  </div>
</ion-content>
