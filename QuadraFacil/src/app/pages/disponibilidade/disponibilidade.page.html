<ion-content [fullscreen]="false">
  <div class="disponibilidade-backdrop" (click)="voltar()">

    <div class="disponibilidade-card" (click)="$event.stopPropagation()">

      <div class="card-header">
        <div class="header-info">
          <p class="titulo-quadra">{{ quadra.nome || 'Quadra' }}</p>
          <p class="subtitulo-balao">Selecione uma data para ver os horários</p>
        </div>
        <button class="btn-fechar" (click)="voltar()">✕</button>
      </div>

      <div class="calendario-wrapper">
        <ion-datetime
          presentation="date"
          [min]="dataMinima"
          [value]="dataSelecionada"
          (ionChange)="onDataSelecionada($event)">
        </ion-datetime>
      </div>

      <div class="horarios-secao" *ngIf="mostrarHorarios">
        <div class="horarios-header">
          <p class="data-titulo">
            <ion-icon name="calendar-outline"></ion-icon>
            Horários para {{ dataFormatadaPT }}
          </p>
          <span class="dica-proprietario" *ngIf="ehProprietario">Toque para alterar status</span>
        </div>

        <div class="horarios-grid">
          <div class="horario-pill" *ngFor="let item of horarios"
            [class.livre]="item.status === 'LIVRE'"
            [class.alugado]="item.status === 'ALUGADO'"
            [class.fechado]="item.status === 'FECHADO'"
            (click)="onClicarHorario(item)">

            <span class="horario-hora">{{ item.horaFormatada }}</span>
            <span class="horario-status-badge">{{ item.status }}</span>
          </div>
        </div>
      </div>

    </div>

  </div>
</ion-content>
