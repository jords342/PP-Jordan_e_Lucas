<ion-content [fullscreen]="false" [scrollEvents]="true">
  <div class="pesquisar-container">

    <p class="titulo">Procurar Quadras</p>

    <!-- Campo de Busca em Pílula -->
    <div class="input-wrapper">
      <ion-input 
        type="text" 
        placeholder="Digite o nome ou endereço..." 
        [(ngModel)]="termoBusca" 
        (ionInput)="filtrarQuadras()">
      </ion-input>
    </div>

    <!-- Mensagem se não encontrar nada -->
    <p *ngIf="quadrasFiltradas.length === 0" class="vazio">Nenhuma quadra encontrada.</p>

    <!-- Lista de Quadras da Busca -->
    <div class="quadra-card" *ngFor="let quadra of quadrasFiltradas" (click)="irParaQuadra(quadra.idQuadra)">
      <div class="quadra-foto">
        <img *ngIf="fotos[quadra.idQuadra]" [src]="fotos[quadra.idQuadra]" alt="Foto da quadra">
        <div *ngIf="!fotos[quadra.idQuadra]" class="sem-foto">
          <ion-icon name="image-outline"></ion-icon>
        </div>
      </div>
      <div class="quadra-info">
        <p class="quadra-nome">{{ quadra.nome }}</p>
        <p class="quadra-endereco">📍 {{ quadra.endereco }}</p>
      </div>
    </div>

  </div>
</ion-content>
